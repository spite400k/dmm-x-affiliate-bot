name: seesaa blog (XML-RPC) DMM

on:
  schedule:
    - cron: '15 3 * * *' # 毎日 UTC3:15（JST 12:15）
    - cron: '15 11 * * *' # 毎日 UTC11:15（JST 20:15）
  workflow_dispatch:

jobs:
  seesaa-xmlrpc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_1 }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_1 }}" >> .env
          echo "SUPABASE_URL_1=${{ secrets.SUPABASE_URL_1 }}" >> .env
          echo "SUPABASE_KEY_1=${{ secrets.SUPABASE_KEY_1 }}" >> .env

      - name: Run seesaa XML-RPC (DMM のみ。アダルト/FANZA はプログラム側で除外)
        env:
          # Seesaa WAF 対策（403 はクラウド IP ブロックの可能性。self-hosted runner 推奨）
          SEESAA_XMLRPC_USER_AGENT: Mozilla/5.0 (compatible; dmm-x-affiliate-bot/1.0)
        run: python main_seesaa_blog.py --account 1 --all-targets

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-artifacts-seesaa-dmm
          path: |
            debug*.html
            debug*.png
          if-no-files-found: ignore
