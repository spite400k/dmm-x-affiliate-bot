name: seesaa blog (XML-RPC) DMM

on:
  schedule:
    - cron: '0 11 * * *' # 毎日 UTC11時（JST 20時）
    - cron: '0 14 * * *' # 毎日 UTC14時（JST 23時）
    - cron: '0 3 * * *' # 毎日 UTC3時（JST 12時）
    - cron: '0 22 * * *' # 毎日 UTC22時（JST 翌7時）
  workflow_dispatch:

jobs:
  seesaa-xmlrpc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_1 }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_1 }}" >> .env
          echo "SUPABASE_URL_1=${{ secrets.SUPABASE_URL_1 }}" >> .env
          echo "SUPABASE_KEY_1=${{ secrets.SUPABASE_KEY_1 }}" >> .env

      - name: Run seesaa XML-RPC (targets ループ)
        env:
          # Seesaa WAF 対策（403 時は ssl エンドポイントへ自動フォールバック）
          SEESAA_XMLRPC_USER_AGENT: Mozilla/5.0 (compatible; dmm-x-affiliate-bot/1.0)
        run: python main_seesaa_blog.py --account 1 --all-targets

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-artifacts-seesaa-dmm
          path: |
            debug*.html
            debug*.png
          if-no-files-found: ignore
