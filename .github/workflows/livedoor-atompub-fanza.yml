name: Livedoor blog (AtomPub) FANZA

on:
  schedule:
    # GHA schedule は遅延しやすいため、目標時刻の 3 時間前に起動（分は 0 分以外）
    - cron: '17 0 * * *' # UTC 0:17（JST 9:17）→ 目標 JST 12:00 頃
    - cron: '17 8 * * *' # UTC 8:17（JST 17:17）→ 目標 JST 20:00 頃
    - cron: '17 10 * * *' # UTC 10:17（JST 19:17）→ 目標 JST 22:00 頃
    - cron: '17 12 * * *' # UTC 12:17（JST 21:17）→ 目標 JST 24:00 頃
  workflow_dispatch:

jobs:
  livedoor-atompub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_2 }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_2 }}" >> .env
          echo "SUPABASE_URL_2=${{ secrets.SUPABASE_URL_2 }}" >> .env
          echo "SUPABASE_KEY_2=${{ secrets.SUPABASE_KEY_2 }}" >> .env

      - name: Run Livedoor AtomPub (targets ループ)
        run: python main_livedoor_atompub.py --account 2 --all-targets

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-artifacts-livedoor-fanza
          path: |
            debug*.html
            debug*.png
          if-no-files-found: ignore
