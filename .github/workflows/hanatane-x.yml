name: Post to Twitter (@hanatane_app)

on:
  workflow_dispatch:
    inputs:
      force_mode:
        description: "投稿モード上書き (news_card / silence_tip / demo / skip)"
        required: false
        default: ""
  schedule:
    # JST 21:00 → UTC 12:00
    - cron: "0 12 * * *"

jobs:
  post-hanatane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore posted-topics cache
        uses: actions/cache@v4
        with:
          path: state/hanatane_posted.json
          key: hanatane-posted-state-v1

      - name: Create .env file from secrets
        run: |
          echo "API_KEY_HANATANE=${{ secrets.API_KEY_HANATANE }}" >> .env
          echo "API_SECRET_KEY_HANATANE=${{ secrets.API_SECRET_KEY_HANATANE }}" >> .env
          echo "ACCESS_TOKEN_HANATANE=${{ secrets.ACCESS_TOKEN_HANATANE }}" >> .env
          echo "ACCESS_TOKEN_SECRET_HANATANE=${{ secrets.ACCESS_TOKEN_SECRET_HANATANE }}" >> .env
          if [ -n "${{ secrets.BEARER_TOKEN_HANATANE }}" ]; then
            echo "BEARER_TOKEN_HANATANE=${{ secrets.BEARER_TOKEN_HANATANE }}" >> .env
          fi

      - name: Run hanatane X bot
        env:
          HANATANE_FORCE_MODE: ${{ github.event.inputs.force_mode }}
        run: python main_hanatane_x.py

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hanatane-post-state
          path: state/hanatane_posted.json
          if-no-files-found: ignore
