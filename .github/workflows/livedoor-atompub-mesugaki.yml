name: Livedoor blog (AtomPub) mesugaki

on:
  schedule:
    - cron: '0 11 * * *' # 毎日 UTC11時（JST 20時）
    - cron: '0 14 * * *' # 毎日 UTC14時（JST 23時）
    - cron: '0 3 * * *' # 毎日 UTC3時（JST 12時）
    - cron: '0 22 * * *' # 毎日 UTC22時（JST 翌7時）
  workflow_dispatch:

jobs:
  livedoor-atompub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_6 }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_6 }}" >> .env
          echo "SUPABASE_URL_6=${{ secrets.SUPABASE_URL_6 }}" >> .env
          echo "SUPABASE_KEY_6=${{ secrets.SUPABASE_KEY_6 }}" >> .env

      - name: Run Livedoor AtomPub (targets ループ)
        run: python main_livedoor_atompub.py --account 6 --all-targets

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-artifacts-livedoor-mesugaki
          path: |
            debug*.html
            debug*.png
          if-no-files-found: ignore
